Resources:
  # S3 (EventBridge enabled on the data lake bucket) → Glue workflow.
  RawDataArrivedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ${self:custom.servicePrefix}-RawDataArrived
      Description: New raw customer file → start the ingestion workflow
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - ${self:custom.s3.dataLakeBucketName}
          object:
            key:
              - prefix: ${self:custom.prefixes.raw}/
      Targets:
        - Id: IngestionWorkflow
          Arn: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${self:custom.glue.workflowName}
          RoleArn: !GetAtt IngestionEventsRole.Arn
