# Batch inference layer: on a schedule, scores every active customer with the
# latest approved model (Athena UNLOAD → Batch Transform) and writes the
# predictions to the data lake (`predictions` table, queryable in Athena).
# No always-on infrastructure: you only pay while the transform job runs.
service: customer-churn-batch
frameworkVersion: ^4.43.0
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  runtime: python3.13
  architecture: arm64
  stackName: ${self:custom.app}-${self:service}
  versionFunctions: false
  deploymentBucket:
    name: ${self:custom.s3.deploymentBucketName.${self:custom.stage}}
  logRetentionInDays: ${self:custom.lambda.logRetentionInDays.${self:custom.stage}}

package:
  individually: true
  patterns:
    - '!./**'

functions:
  - ${file(functions.yml)}

resources:
  - ${file(iam.yml)}
  - ${file(events.yml)}
  - ${file(cfn-collisions.yml)}

plugins:
  - serverless-deployment-bucket
  - '@serverless/safeguards-plugin'

custom:
  org: ${env:ORG}
  app: data-science
  project: customer-churn
  stage: ${opt:stage, self:provider.stage}
  safeguards:
    - safeguard: framework-version
      enforcementLevel: warning
      config: ${self:frameworkVersion}
    - safeguard: allowed-regions
      enforcementLevel: error
      config:
        - ${self:provider.region}
    - safeguard: no-wild-iam-role-statements
      enforcementLevel: warning
    - safeguard: allowed-runtimes
      config:
        - ${self:provider.runtime}
    - safeguard: allowed-function-names
      enforcementLevel: warning
      config: ${self:custom.servicePrefix}-${FUNCTION}
    - safeguard: allowed-stages
      enforcementLevel: error
      config:
        - dev
        - test
        - prod
  servicePrefix: ${self:custom.app}-${self:service}
  developer: ${env:DEVELOPER}
  dataSsmPrefix: /${self:custom.app}-customer-churn-data
  pipelineSsmPrefix: /${self:custom.app}-customer-churn-pipeline
  batch:
    schedule: cron(0 7 * * ? *)
    scheduleEnabled:
      dev: false
      test: false
      prod: true
    instanceType: ml.m5.large
    inputPrefix: batch/${self:custom.project}/input
  glue:
    databaseName: ${ssm:${self:custom.dataSsmPrefix}/GlueDatabaseName}
    curatedTableName: ${ssm:${self:custom.dataSsmPrefix}/CuratedTableName}
    curatedPrefix: ${ssm:${self:custom.dataSsmPrefix}/CuratedPrefix}
    predictionsPrefix: ${ssm:${self:custom.dataSsmPrefix}/PredictionsPrefix}
  sagemaker:
    executionRoleArn: ${ssm:${self:custom.pipelineSsmPrefix}/SageMakerExecutionRoleArn}
    modelPackageGroupName: ${ssm:${self:custom.pipelineSsmPrefix}/ModelPackageGroupName}
    approvedModelPackageParameter: ${self:custom.pipelineSsmPrefix}/ApprovedModelPackageArn
  athena:
    workGroupName: ${ssm:/${self:custom.app}-common-infrastructure/AthenaWorkGroupName}
    resultsBucketArn: ${ssm:/${self:custom.app}-common-infrastructure/AthenaResultsBucketArn}
  lambda:
    logRetentionInDays:
      dev: 1
      test: 3
      prod: 7
  sns:
    notificationsTopicArn: ${ssm:/${self:custom.app}-common-infrastructure/NotificationsTopicArn}
  s3:
    deploymentBucketName:
      dev: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.${self:custom.developer}.deploys
      test: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.deploys
      prod: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.deploys
    dataLakeBucketName: ${ssm:/${self:custom.app}-common-infrastructure/DataLakeBucketName}
    dataLakeBucketArn: ${ssm:/${self:custom.app}-common-infrastructure/DataLakeBucketArn}
    artifactsBucketName: ${ssm:/${self:custom.app}-common-infrastructure/ArtifactsBucketName}
    artifactsBucketArn: ${ssm:/${self:custom.app}-common-infrastructure/ArtifactsBucketArn}
