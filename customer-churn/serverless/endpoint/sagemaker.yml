Resources:
  # Model and EndpointConfig are immutable and unnamed on purpose: a new
  # approved package replaces them, and the Endpoint switches over with a
  # blue/green update.
  ChurnModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: ${self:custom.model.executionRoleArn}
      Containers:
        - ModelPackageName: ${self:custom.model.packageArn}
      Tags:
        - Key: ModelPackageArn
          Value: ${self:custom.model.packageArn}

  ChurnEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: AllTraffic
          ModelName: !GetAtt ChurnModel.ModelName
          InstanceType: ${self:custom.endpoint.instanceType}
          InitialInstanceCount: ${self:custom.endpoint.instanceCount}
          InitialVariantWeight: 1
      # Requests/responses sampled to S3: input for the DataDrift monitor (and for
      # future ground-truth joins / retraining datasets).
      DataCaptureConfig:
        EnableCapture: true
        InitialSamplingPercentage: ${self:custom.endpoint.dataCapturePercentage.${self:custom.stage}}
        DestinationS3Uri: s3://${self:custom.s3.artifactsBucketName}/${self:custom.prefixes.dataCapture}
        CaptureOptions:
          - CaptureMode: Input
          - CaptureMode: Output
        CaptureContentTypeHeader:
          CsvContentTypes:
            - text/csv
          JsonContentTypes:
            - application/json

  ChurnEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: ${self:custom.endpoint.name}
      EndpointConfigName: !GetAtt ChurnEndpointConfig.EndpointConfigName
      # Blue/green: the new fleet gets all traffic, is watched for the baking
      # period and rolled back automatically if the 5XX alarm fires.
      DeploymentConfig:
        BlueGreenUpdatePolicy:
          TrafficRoutingConfiguration:
            Type: ALL_AT_ONCE
            WaitIntervalInSeconds: 0
          TerminationWaitInSeconds: 300
          MaximumExecutionTimeoutInSeconds: 3600
        AutoRollbackConfiguration:
          Alarms:
            - AlarmName: ${self:custom.servicePrefix}-Invocation5XXErrors
