Resources:
  # Used by the pipeline itself and by every job it launches (processing,
  # training), plus models and Batch Transform downstream.
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.iam.sageMakerRoleName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      # Broad on SageMaker APIs (jobs, registry, experiments, ECR pulls,
      # logs) to keep the learning project readable; data access is scoped.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-SageMaker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - ${self:custom.s3.artifactsBucketArn}
                  - ${self:custom.s3.dataLakeBucketArn}
              # Pipeline artifacts, data capture, monitoring reports and
              # batch inputs all live in the artifacts bucket.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: ${self:custom.s3.artifactsBucketArn}/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: ${self:custom.s3.dataLakeBucketArn}/${self:custom.glue.curatedPrefix}/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: ${self:custom.s3.dataLakeBucketArn}/${self:custom.glue.predictionsPrefix}/*
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                  - athena:GetWorkGroup
                Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${self:custom.athena.pipelineWorkGroupName}
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartition
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${self:custom.glue.databaseName}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${self:custom.glue.databaseName}/*
              # Pull the project's model image (jobs, endpoints, transform).
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: ${self:custom.image.repositoryArn}
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: arn:aws:iam::${aws:accountId}:role/${self:custom.iam.sageMakerRoleName}
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com

  # EventBridge → StartPipelineExecution (new data, schedule).
  PipelineEventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-PipelineEvents
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-PipelineEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sagemaker:StartPipelineExecution
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/${self:custom.pipeline.name}

  OnModelApprovedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.servicePrefix}-OnModelApproved
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ${self:custom.servicePrefix}-OnModelApproved
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sagemaker:DescribeModelPackage
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package/${self:custom.registry.modelPackageGroupName}/*
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${self:custom.servicePrefix}/Approved*
              - Effect: Allow
                Action: sns:Publish
                Resource: ${self:custom.sns.notificationsTopicArn}
