Resources:
  SageMakerExecutionRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /${self:custom.servicePrefix}/SageMakerExecutionRoleArn
      Tier: Standard
      Type: String
      Value: !GetAtt SageMakerExecutionRole.Arn

  ModelPackageGroupNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /${self:custom.servicePrefix}/ModelPackageGroupName
      Tier: Standard
      Type: String
      Value: ${self:custom.registry.modelPackageGroupName}

  # Deployment contract. Created here with a placeholder; OnModelApproved
  # overwrites the values on every approval (CloudFormation leaves them alone
  # unless these definitions change).
  ApprovedModelPackageArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /${self:custom.servicePrefix}/ApprovedModelPackageArn
      Description: Latest approved model package (written by OnModelApproved)
      Tier: Standard
      Type: String
      Value: none

  ApprovedBaselineConstraintsUriParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /${self:custom.servicePrefix}/ApprovedBaselineConstraintsUri
      Description: Data quality constraints of the approved model
      Tier: Standard
      Type: String
      Value: none

  ApprovedBaselineStatisticsUriParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /${self:custom.servicePrefix}/ApprovedBaselineStatisticsUri
      Description: Data quality statistics of the approved model
      Tier: Standard
      Type: String
      Value: none
