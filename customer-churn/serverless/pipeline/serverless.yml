# Model building layer: SageMaker Pipeline (continuous training), Model
# Registry, and the events around them — new curated data / schedule start
# the pipeline; registrations notify the team; approvals update the
# deployment contract (SSM) consumed by serverless/endpoint and
# serverless/batch.
service: customer-churn-pipeline
frameworkVersion: ^4.43.0
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  runtime: python3.13
  architecture: arm64
  stackName: ${self:custom.app}-${self:service}
  versionFunctions: false
  deploymentBucket:
    name: ${self:custom.s3.deploymentBucketName.${self:custom.stage}}
  logRetentionInDays: ${self:custom.lambda.logRetentionInDays.${self:custom.stage}}

package:
  individually: true
  patterns:
    - '!./**'

functions:
  - ${file(functions.yml)}

resources:
  - ${file(iam.yml)}
  - ${file(sagemaker.yml)}
  - ${file(athena.yml)}
  - ${file(events.yml)}
  - ${file(ssm.yml)}
  - ${file(cfn-collisions.yml)}

plugins:
  - serverless-deployment-bucket
  - '@serverless/safeguards-plugin'

custom:
  org: ${env:ORG}
  app: data-science
  project: customer-churn
  stage: ${opt:stage, self:provider.stage}
  safeguards:
    - safeguard: framework-version
      enforcementLevel: warning
      config: ${self:frameworkVersion}
    - safeguard: allowed-regions
      enforcementLevel: error
      config:
        - ${self:provider.region}
    - safeguard: no-wild-iam-role-statements
      enforcementLevel: warning
    - safeguard: allowed-runtimes
      config:
        - ${self:provider.runtime}
    - safeguard: allowed-function-names
      enforcementLevel: warning
      config: ${self:custom.servicePrefix}-${FUNCTION}
    - safeguard: allowed-stages
      enforcementLevel: error
      config:
        - dev
        - test
        - prod
  servicePrefix: ${self:custom.app}-${self:service}
  developer: ${env:DEVELOPER}
  prefixes:
    pipeline: pipelines/${self:custom.project}
  pipeline:
    name: ${self:custom.project}-training
    minRocAuc: ${env:MIN_ROC_AUC, '0.80'}
    # Continuous training on a schedule (besides new-data triggers).
    retrainingSchedule: cron(0 6 ? * MON *)
    retrainingScheduleState:
      dev: DISABLED
      test: DISABLED
      prod: ENABLED
  registry:
    modelPackageGroupName: ${self:custom.project}
    # Instance types a registered version can be deployed on (the endpoint
    # uses ml.t2.medium).
    realtimeInstanceTypes:
      - ml.t2.medium
      - ml.m5.large
      - ml.m5.xlarge
    transformInstanceTypes:
      - ml.m5.large
      - ml.m5.xlarge
  # Project image (container/Dockerfile) from serverless/image. `tag` is the
  # content hash and fails the deploy if that tag wasn't pushed yet.
  image:
    repositoryName: ${ssm:/${self:custom.app}-customer-churn-image/RepositoryName}
    repositoryArn: ${ssm:/${self:custom.app}-customer-churn-image/RepositoryArn}
    repositoryUri: ${ssm:/${self:custom.app}-customer-churn-image/RepositoryUri}
    tag: ${file(../../container/image-version.js)}
  iam:
    sageMakerRoleName: ${self:custom.servicePrefix}-SageMaker
  glue:
    databaseName: ${ssm:/${self:custom.app}-customer-churn-data/GlueDatabaseName}
    curatedTableName: ${ssm:/${self:custom.app}-customer-churn-data/CuratedTableName}
    curatedPrefix: ${ssm:/${self:custom.app}-customer-churn-data/CuratedPrefix}
    predictionsPrefix: ${ssm:/${self:custom.app}-customer-churn-data/PredictionsPrefix}
    curateJobName: ${ssm:/${self:custom.app}-customer-churn-data/CurateJobName}
  athena:
    # Own workgroup (results location not enforced) for the SageMaker
    # Athena dataset definition, which sets its own OutputS3Uri.
    pipelineWorkGroupName: ${self:custom.project}-pipeline
  lambda:
    logRetentionInDays:
      dev: 1
      test: 3
      prod: 7
  sns:
    notificationsTopicArn: ${ssm:/${self:custom.app}-common-infrastructure/NotificationsTopicArn}
  s3:
    deploymentBucketName:
      dev: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.${self:custom.developer}.deploys
      test: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.deploys
      prod: ${self:provider.region}.${self:custom.org}.${self:custom.app}.${self:custom.stage}.deploys
    dataLakeBucketArn: ${ssm:/${self:custom.app}-common-infrastructure/DataLakeBucketArn}
    artifactsBucketName: ${ssm:/${self:custom.app}-common-infrastructure/ArtifactsBucketName}
    artifactsBucketArn: ${ssm:/${self:custom.app}-common-infrastructure/ArtifactsBucketArn}
