on=mxgraph.aws4.group_vpc2;strokeColor=#8C4FFF;fillColor=none;verticalAlign=top;align=left;spacingLeft=30;fontColor=#AAB7B8;dashed=0;fontFamily=Verdana;\" value=\"VPC&amp;lt;br&amp;gt;(app subnets)\" vertex=\"1\"&gt;&lt;mxGeometry x=\"400\" y=\"890\" width=\"190\" height=\"90\" as=\"geometry\" /&gt;&lt;/mxCell&gt;&lt;mxCell id=\"infra-38\" parent=\"infra-studio\" style=\"text;whiteSpace=wrap;html=1;fontFamily=Verdana;\" value=\"&amp;lt;font style=&amp;quot;font-size: 25px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓫&amp;lt;/font&amp;gt;\" vertex=\"1\"&gt;&lt;mxGeometry x=\"560\" y=\"860\" width=\"48\" height=\"52\" as=\"geometry\" /&gt;&lt;/mxCell&gt;&lt;mxCell id=\"infra-39\" edge=\"1\" parent=\"infra-studio\" source=\"infra-32\" target=\"infra-37\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;curved=0;orthogonalLoop=1;jettySize=auto;html=1;fontFamily=Verdana;exitX=1;exitY=0.5;exitDx=0;exitDy=0;exitPerimeter=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;entryPerimeter=0;\" value=\"\"&gt;&lt;mxGeometry relative=\"1\" as=\"geometry\"&gt;&lt;Array as=\"points\"&gt;&lt;mxPoint x=\"320\" y=\"869\" /&gt;&lt;mxPoint x=\"320\" y=\"935\" /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\"infra-info\" parent=\"infra-0\" value=\"infra-info\" /&gt;&lt;mxCell id=\"infra-infobox\" parent=\"infra-info\" style=\"text;html=1;spacing=20;spacingTop=-30;whiteSpace=wrap;overflow=hidden;rounded=1;fontSize=12;fontFamily=Helvetica;fillColor=#7EA6E0;strokeColor=none;arcSize=4;glass=0;shadow=0;opacity=25;\" value=\"&amp;lt;h1 style=&amp;quot;line-height: 120%;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Verdana&amp;quot; style=&amp;quot;font-size: 18px;&amp;quot;&amp;gt;Data Science Infrastructure&amp;lt;/font&amp;gt;&amp;lt;/h1&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify; line-height: 120%;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Verdana&amp;quot;&amp;gt;&amp;lt;p&amp;gt;Shared platform of the &amp;lt;b&amp;gt;data-science&amp;lt;/b&amp;gt; MLOps repository. It has no application code: it creates the resources every MLOps project needs and publishes their names, so each project only has to deploy its own stacks. It lives in the &amp;lt;b&amp;gt;Common Infrastructure&amp;lt;/b&amp;gt; stack, plus the &amp;lt;b&amp;gt;SageMaker Studio&amp;lt;/b&amp;gt; stack and the &amp;lt;b&amp;gt;VPC&amp;lt;/b&amp;gt; it runs in.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The &amp;lt;b&amp;gt;MLOps team&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➊&amp;lt;/font&amp;gt; develops and operates the &amp;lt;b&amp;gt;MLOps projects&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➋&amp;lt;/font&amp;gt; (today, Customer Churn). When a project is deployed it reads from &amp;lt;b&amp;gt;SSM Parameters&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➌&amp;lt;/font&amp;gt; the names of the shared resources, so no project hard-codes them.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The &amp;lt;b&amp;gt;Data Lake Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➍&amp;lt;/font&amp;gt; is split into zones per project: raw data as it arrives, curated data ready for analytics and machine learning, and the predictions produced by the models. Every new object is announced to &amp;lt;b&amp;gt;EventBridge&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➎&amp;lt;/font&amp;gt;, so projects can start their data pipelines as soon as new data lands without configuring anything on the bucket.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The &amp;lt;b&amp;gt;Artifacts Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➏&amp;lt;/font&amp;gt; keeps everything machine learning produces: training datasets, models, evaluation reports, monitoring baselines and the traffic captured from endpoints. Both buckets are versioned so every registered model stays reproducible.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Analysts and projects query the data lake through the shared &amp;lt;b&amp;gt;Athena Workgroup&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➐&amp;lt;/font&amp;gt;, which enforces a scan limit per query and stores results in the &amp;lt;b&amp;gt;Athena Results Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➑&amp;lt;/font&amp;gt;, where they expire automatically.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The &amp;lt;b&amp;gt;Notifications Topic&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➒&amp;lt;/font&amp;gt; is the single channel for people: pipeline failures, models waiting for approval, approved models and endpoint or data drift alarms published by the projects reach the team by email.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;SageMaker Studio&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➓&amp;lt;/font&amp;gt; gives the team a web interface over the same resources to follow pipeline executions, approve models in the registry and inspect endpoints and monitoring reports.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Studio keeps each user&#x27;s files on a disk it mounts through the &amp;lt;b&amp;gt;VPC&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓫&amp;lt;/font&amp;gt;, created with a vendored VPC library. Studio reaches the internet and AWS through SageMaker&#x27;s own network, so the VPC needs no NAT gateways; no other piece of the projects runs inside it.&amp;lt;/p&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\" vertex=\"1\"&gt;&lt;mxGeometry x=\"1480\" y=\"40\" width=\"720\" hei ml=1;fontFamily=Verdana;exitX=0.5;exitY=0;exitDx=0;exitDy=0;exitPerimeter=0;entryX=0.5;entryY=0;entryDx=0;entryDy=0;entryPerimeter=0;\" value=\"\"&gt;&lt;mxGeometry relative=\"1\" as=\"geometry\"&gt;&lt;Array as=\"points\"&gt;&lt;mxPoint x=\"70\" y=\"20\" /&gt;&lt;mxPoint x=\"1539\" y=\"20\" /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\"churn-train-66\" edge=\"1\" parent=\"churn-train-governance\" source=\"churn-train-13\" target=\"churn-train-1\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;curved=0;orthogonalLoop=1;jettySize=auto;html=1;fontFamily=Verdana;dashed=1;exitX=0;exitY=0.8;exitDx=0;exitDy=0;exitPerimeter=0;entryX=0.5;entryY=1;entryDx=0;entryDy=0;entryPerimeter=0;\" value=\"\"&gt;&lt;mxGeometry relative=\"1\" as=\"geometry\"&gt;&lt;Array as=\"points\"&gt;&lt;mxPoint x=\"1900\" y=\"722\" /&gt;&lt;mxPoint x=\"1900\" y=\"840\" /&gt;&lt;mxPoint x=\"70\" y=\"840\" /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\"churn-train-info\" parent=\"churn-train-0\" value=\"churn-train-info\" /&gt;&lt;mxCell id=\"churn-train-infobox\" parent=\"churn-train-info\" style=\"text;html=1;spacing=20;spacingTop=-30;whiteSpace=wrap;overflow=hidden;rounded=1;fontSize=12;fontFamily=Helvetica;fillColor=#7EA6E0;strokeColor=none;arcSize=4;glass=0;shadow=0;opacity=25;\" value=\"&amp;lt;h1 style=&amp;quot;line-height: 120%;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Verdana&amp;quot; style=&amp;quot;font-size: 18px;&amp;quot;&amp;gt;Customer Churn Training Flow&amp;lt;/font&amp;gt;&amp;lt;/h1&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify; line-height: 120%;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Verdana&amp;quot;&amp;gt;&amp;lt;p&amp;gt;Reference MLOps project that predicts which customers will churn, trained on the public IBM Telco Customer Churn dataset. This page covers how data arrives and how models are trained, validated, registered and approved. It spans the &amp;lt;b&amp;gt;Data&amp;lt;/b&amp;gt;, &amp;lt;b&amp;gt;Image&amp;lt;/b&amp;gt; and &amp;lt;b&amp;gt;Pipeline&amp;lt;/b&amp;gt; stacks and uses the shared buckets, Athena and notifications of the Common Infrastructure.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;A &amp;lt;b&amp;gt;Data scientist&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➊&amp;lt;/font&amp;gt; runs the &amp;lt;b&amp;gt;IngestDataset Lambda&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➋&amp;lt;/font&amp;gt;, which downloads the dataset (optionally simulating a market drift) into the raw zone of the &amp;lt;b&amp;gt;Data Lake Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➌&amp;lt;/font&amp;gt;. The new file matches the &amp;lt;b&amp;gt;Raw Data Rule&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➍&amp;lt;/font&amp;gt;, which starts the &amp;lt;b&amp;gt;Glue Workflow&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➎&amp;lt;/font&amp;gt; after grouping files that arrive together.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The workflow runs the &amp;lt;b&amp;gt;Glue Crawler&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➏&amp;lt;/font&amp;gt;, which discovers the raw schema and registers it in the &amp;lt;b&amp;gt;Glue Data Catalog&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➑&amp;lt;/font&amp;gt;; when it succeeds, the &amp;lt;b&amp;gt;Curation Job&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➐&amp;lt;/font&amp;gt; reads the raw file, cleans and types every column and evaluates the data quality rules. If any rule fails the job fails and nothing downstream runs; otherwise it writes the curated data back to the data lake, where &amp;lt;b&amp;gt;Athena&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓫&amp;lt;/font&amp;gt; reads it through a table declared as code in the catalog.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;A successful curation matches the &amp;lt;b&amp;gt;Training Triggers&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➒&amp;lt;/font&amp;gt;, which also run a weekly retraining in production, and starts the &amp;lt;b&amp;gt;SageMaker Pipeline&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➓&amp;lt;/font&amp;gt;. Its first step asks Athena for the latest curated data, validates it (columns, minimum rows, valid target) and splits it into train, validation and test sets. Then it computes a statistical baseline of the training data, trains the model and evaluates it on the test set. Every step runs the project&#x27;s own image from the &amp;lt;b&amp;gt;Model Image Repository&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓬&amp;lt;/font&amp;gt;, tagged with a hash of its content, and leaves its outputs in the &amp;lt;b&amp;gt;Artifacts Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓭&amp;lt;/font&amp;gt;.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;If the test ROC AUC is below the configured threshold the pipeline stops with an explicit failure. Otherwise it registers a new version in the &amp;lt;b&amp;gt;Model Registry&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓮&amp;lt;/font&amp;gt; with its metrics, its baseline and the exact image that trained it, waiting for manual approval.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The &amp;lt;b&amp;gt;Registry Rules&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓯&amp;lt;/font&amp;gt; send to the &amp;lt;b&amp;gt;Notifications Topic&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓰&amp;lt;/font&amp;gt; every new version waiting for approval and every failed pipeline execution. The data scientist reviews the metrics and approves the version; the approval reaches the &amp;lt;b&amp;gt;OnModelApproved Lambda&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓱&amp;lt;/font&amp;gt;, which publishes the approved model and its baseline as the &amp;lt;b&amp;gt;Deployment Contract (SSM)&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;⓲&amp;lt;/font&amp;gt; and emails the command to release it. Approving never deploys by itself: the inference stacks read that contract (see the Customer Churn Inference page).&amp;lt;/p&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\" vertex=\"1\"&gt;&lt;mxGeometry x=\"2440\" y=\"40\" width=\"720\" height=\"580\" as=\"geometry\" /&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;\n&lt;diagram id=\"churn-inference-page\" name=\"Customer Churn Inference\"&gt;&lt;mxGraphModel grid=\"0\" page=\"1\" background=\"#ffffff\"&gt;&lt;root&gt;&lt;mxCell id=\"churn-inference-0\" /&gt;&lt;mxCell id=\"churn-inference-bg\" parent=\"churn-inference-0\" value=\"background\" /&gt;&lt;mxCell id=\"churn-inference-bgr\" parent=\"churn-inference-bg\" style=\"whiteSpace=wrap;html=1;strokeColor=none;\" value=\"\" vertex=\"1\"&gt;&lt;mxGeometry width=\"2560\" height=\"1100\" as=\"geometry\" /&gt;&lt;/mxCell&gt;&lt;mxCell id=\"churn-inference-common\" parent=\"churn-inference-0\" value=\"churn-inference-common\" /&gt;&lt;mxCell id=\"churn-inference-online\" parent=\"churn-inference-0\" value=\"churn-inference-online\" /&gt;&lt;mxCell id=\"churn-inference-batch\" par xitX=1;exitY=0.5;exitDx=0;exitDy=0;exitPerimeter=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;entryPerimeter=0;\" value=\"\"&gt;&lt;mxGeometry relative=\"1\" as=\"geometry\"&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\"churn-inference-64\" edge=\"1\" parent=\"churn-inference-batch\" source=\"churn-inference-53\" target=\"churn-inference-16\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=1;curved=0;orthogonalLoop=1;jettySize=auto;html=1;fontFamily=Verdana;exitX=1;exitY=0.5;exitDx=0;exitDy=0;exitPerimeter=0;entryX=1;entryY=0.5;entryDx=0;entryDy=0;entryPerimeter=0;\" value=\"\"&gt;&lt;mxGeometry relative=\"1\" as=\"geometry\"&gt;&lt;Array as=\"points\"&gt;&lt;mxPoint x=\"1460\" y=\"819\" /&gt;&lt;mxPoint x=\"1460\" y=\"509\" /&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\"churn-inference-info\" parent=\"churn-inference-0\" value=\"churn-inference-info\" /&gt;&lt;mxCell id=\"churn-inference-infobox\" parent=\"churn-inference-info\" style=\"text;html=1;spacing=20;spacingTop=-30;whiteSpace=wrap;overflow=hidden;rounded=1;fontSize=12;fontFamily=Helvetica;fillColor=#7EA6E0;strokeColor=none;arcSize=4;glass=0;shadow=0;opacity=25;\" value=\"&amp;lt;h1 style=&amp;quot;line-height: 120%;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Verdana&amp;quot; style=&amp;quot;font-size: 18px;&amp;quot;&amp;gt;Customer Churn Inference Flow&amp;lt;/font&amp;gt;&amp;lt;/h1&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify; line-height: 120%;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Verdana&amp;quot;&amp;gt;&amp;lt;p&amp;gt;How approved churn models are served: online through an HTTP API backed by a monitored real-time endpoint (&amp;lt;b&amp;gt;Endpoint&amp;lt;/b&amp;gt; stack), and in batch for every active customer (&amp;lt;b&amp;gt;Batch&amp;lt;/b&amp;gt; stack). Both only use models a person approved, read from the deployment contract written by the training flow.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;Online, a &amp;lt;b&amp;gt;Client system&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➊&amp;lt;/font&amp;gt; calls the &amp;lt;b&amp;gt;HTTP API&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➋&amp;lt;/font&amp;gt;, which is open to anyone (no authentication, this is a learning project) but limited to a number of requests per second. The &amp;lt;b&amp;gt;Predict Lambda&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➌&amp;lt;/font&amp;gt; validates the customers in the request, normalizes their categories and sends them to the &amp;lt;b&amp;gt;SageMaker Endpoint&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➍&amp;lt;/font&amp;gt; in the exact column order the model expects, returning each customer&#x27;s churn probability.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The endpoint is created from the &amp;lt;b&amp;gt;Deployment Contract (SSM)&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➎&amp;lt;/font&amp;gt; when its stack is deployed: releasing a newly approved version is redeploying that stack, which shifts traffic to the new model with a blue/green update and rolls back automatically if errors appear. It runs the image of that version from the &amp;lt;b&amp;gt;Model Image Repository&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➏&amp;lt;/font&amp;gt; on a single small instance.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;The endpoint copies requests and responses to the &amp;lt;b&amp;gt;Artifacts Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➐&amp;lt;/font&amp;gt;. Every hour, the &amp;lt;b&amp;gt;DataDrift Lambda&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➑&amp;lt;/font&amp;gt; reads that captured traffic, compares the distribution of every feature with the reference profile computed when the model was trained (Population Stability Index) and writes a drift report; it replaces SageMaker Model Monitor, which no longer accepts new customers. &amp;lt;b&amp;gt;CloudWatch Alarms&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➒&amp;lt;/font&amp;gt; watch the endpoint errors, its latency and the drift measured by the Lambda, and notify the &amp;lt;b&amp;gt;Notifications Topic&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(0, 127, 255);&amp;quot;&amp;gt;➓&amp;lt;/font&amp;gt;; a drift alarm is the signal to retrain.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;In batch, the &amp;lt;b&amp;gt;Daily Schedule&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➊&amp;lt;/font&amp;gt; (production only) runs the &amp;lt;b&amp;gt;BatchScoring Lambda&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➋&amp;lt;/font&amp;gt;, which reads the approved model from the &amp;lt;b&amp;gt;Deployment Contract (SSM)&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➌&amp;lt;/font&amp;gt; and asks &amp;lt;b&amp;gt;Athena&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➍&amp;lt;/font&amp;gt; to export the active customers of the latest curated data from the &amp;lt;b&amp;gt;Data Lake Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➎&amp;lt;/font&amp;gt; into the &amp;lt;b&amp;gt;Artifacts Bucket&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➏&amp;lt;/font&amp;gt;.&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;It then starts a &amp;lt;b&amp;gt;Batch Transform&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➐&amp;lt;/font&amp;gt; job with the approved model, which runs its image from the &amp;lt;b&amp;gt;Model Image Repository&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➑&amp;lt;/font&amp;gt;, scores every customer without sending the customer id to the model, joins the id back to each probability and writes the results to the predictions zone of the data lake, where Athena can query the customers most likely to churn. If the job fails, the &amp;lt;b&amp;gt;Transform Failed Rule&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➒&amp;lt;/font&amp;gt; notifies the &amp;lt;b&amp;gt;Notifications Topic&amp;lt;/b&amp;gt; &amp;lt;font style=&amp;quot;font-size: 18px; color: rgb(103, 171, 159);&amp;quot;&amp;gt;➓&amp;lt;/font&amp;gt;.&amp;lt;/p&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\" vertex=\"1\"&gt;&lt;mxGeometry x=\"1820\" y=\"40\" width=\"720\" height=\"530\" as=\"geometry\" /&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;\n&lt;/mxfile&gt;\n"}'
